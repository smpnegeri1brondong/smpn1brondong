<script>
// NOTE: Token masih client-side sementara, nanti pindah ke Cloud Function biar aman
const TELEGRAM_BOT_TOKEN="8698871747:AAEx0uaQQJDnav9w489HyXkND9D5v-Gknog"; const TELEGRAM_CHAT_ID="-1004475454449";
function dataURLtoBlob(d){const a=d.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]);let n=b.length;const u=new Uint8Array(n);while(n--)u[n]=b.charCodeAt(n);return new Blob([u],{type:m});}
async function kirimTelegram(data){const cap=`🔔 TAMU BARU - SMPN 1 BRONDONG\n━━━━━━━━━━━━━━\n👤 Nama: ${data.nama}\n🏢 Instansi: ${data.instansi||'-'}\n📅 ${data.tanggal} ⏰ ${data.jam}\n🎯 Tujuan: ${data.tujuan||'-'}\n📝 Keperluan: ${data.keperluan||'-'}\n━━━━━━━━━━━━━━\n⏱️ ${data.createdLocal}`; try{if(data.foto){const blob=dataURLtoBlob(data.foto);const fd=new FormData();fd.append('chat_id',TELEGRAM_CHAT_ID);fd.append('photo',blob,'tamu.jpg');fd.append('caption',cap);const r=await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`,{method:'POST',body:fd});const j=await r.json();if(j.ok)return j;} const r2=await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:cap})});return await r2.json();}catch(e){return{ok:false,error:e.message};} }
</script>

<script type="module">
import {initializeApp} from 'firebase/app'; import {getFirestore, collection, addDoc, serverTimestamp} from 'firebase/firestore';
 const firebaseConfig = {
   apiKey: "AIzaSyD2altkh4JhI6uVESIAvd8wCyBDDwam6qw",
   authDomain: "smpn1-brondong-bukutamu.firebaseapp.com",
   projectId: "smpn1-brondong-bukutamu",
   storageBucket: "smpn1-brondong-bukutamu.firebasestorage.app",
   messagingSenderId: "34578499159",
   appId: "1:34578499159:web:37c7570af0c35b3b18c512",
   measurementId: "G-N7ZYV6X6D2"
 };
let db; try{const app=initializeApp(firebaseConfig); db=getFirestore(app); document.getElementById('fbStatus').textContent='Terhubung';}catch(e){document.getElementById('fbStatus').textContent='Error: '+e.message;}
let stream=null, fotoBase64=null, currentFacing='user';
function stopStream(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
window.aktifkanKamera=async()=>{
  const v=document.getElementById('video'),o=document.getElementById('cameraOff');
  stopStream();
  try{
    const constraints = { video: { facingMode: currentFacing==='user'?'user':{exact:'environment'}, width:{ideal:640}, height:{ideal:480} } };
    // fallback jika exact environment gagal
    try{ stream=await navigator.mediaDevices.getUserMedia(constraints); }
    catch(err){ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:currentFacing}}); }
    v.srcObject=stream;
    if(currentFacing==='user') v.classList.add('mirror'); else v.classList.remove('mirror');
    document.getElementById('camLabel').textContent=currentFacing==='user'?'Depan':'Belakang';
    o.style.display='none';
  }catch(e){ alert('Gagal kamera: '+e.message); o.style.display='grid';}
};
window.switchKamera=async()=>{
  currentFacing = currentFacing==='user'?'environment':'user';
  await window.aktifkanKamera();
};
window.addEventListener('load',()=>{setTimeout(()=>window.aktifkanKamera(),500); document.getElementById('tanggal').valueAsDate=new Date(); document.getElementById('jam').value=new Date().toTimeString().slice(0,5);});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ stopStream(); } else { if(!stream) window.aktifkanKamera(); } });
window.ambilFoto=()=>{const v=document.getElementById('video'),c=document.getElementById('canvasFoto'); if(!v.srcObject){alert('Kamera dulu');return;} c.width=v.videoWidth; c.height=v.videoHeight; const ctx=c.getContext('2d'); if(currentFacing==='user'){ ctx.translate(c.width,0); ctx.scale(-1,1);} ctx.drawImage(v,0,0,c.width,c.height); document.getElementById('previewImg').src=c.toDataURL('image/jpeg',0.7); document.getElementById('previewWrap').style.display='block';};
window.retake=()=>{document.getElementById('previewWrap').style.display='none'; document.getElementById('previewImg').src='';};
window.pakaiFoto=()=>{fotoBase64=document.getElementById('previewImg').src; document.getElementById('fotoTamuThumb').src=fotoBase64; document.getElementById('thumbWrap').style.display='flex'; document.getElementById('fotoStatus').textContent='✓ Foto siap ('+Math.round(fotoBase64.length/1024)+'KB)'; retake();};
function compress(dataURL,maxW=480,q=0.62){return new Promise(r=>{const i=new Image(); i.onload=()=>{let w=i.width,h=i.height; if(w>maxW){h=h*(maxW/w); w=maxW;} const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(i,0,0,w,h); r(cv.toDataURL('image/jpeg',q));}; i.src=dataURL;});}
window.simpanTamu=async()=>{
  const nama=document.getElementById('nama').value.trim(); if(!nama){alert('Nama wajib');return;} if(!fotoBase64){alert('Foto dulu');return;}
  const dl={nama,instansi:document.getElementById('instansi').value.trim(),tanggal:document.getElementById('tanggal').value||new Date().toISOString().split('T')[0],jam:document.getElementById('jam').value||new Date().toTimeString().slice(0,5),tujuan:document.getElementById('tujuan').value.trim(),keperluan:document.getElementById('keperluan').value.trim(),createdLocal:new Date().toLocaleString('id-ID')};
  document.getElementById('status').textContent='⏳ Mengirim';
  try{
    const small=await compress(fotoBase64,480,0.62);
    const [_,tg]=await Promise.all([
      addDoc(collection(db,'buku_tamu'),{...dl,fotoURL:small,created:serverTimestamp()}),
      kirimTelegram({...dl,foto:small})
    ]);
    document.getElementById('status').innerHTML='✅ Terkirim '+(tg.ok?'ke Petugas':'');
    document.getElementById('nama').value='';document.getElementById('instansi').value='';document.getElementById('tujuan').value='';document.getElementById('keperluan').value=''; fotoBase64=null; document.getElementById('thumbWrap').style.display='none'; document.getElementById('fotoStatus').textContent='Belum ada foto';
  }catch(e){document.getElementById('status').textContent='Error: '+e.message;}
};
</script>

<script id="single-hamburger">
(function(){
  function init(){
    const btn=document.getElementById('btn-hamburger');
    const menu=document.getElementById('nav-mobile');
    if(!btn||!menu) return;
    btn.addEventListener('click',function(e){e.stopPropagation();menu.classList.toggle('show');btn.classList.toggle('active');});
    document.addEventListener('click',function(e){if(!menu.contains(e.target)&&!btn.contains(e.target)){menu.classList.remove('show');btn.classList.remove('active');}});
    menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menu.classList.remove('show');btn.classList.remove('active');}));
    // WA close
    const f=document.getElementById('waFloat'), l=document.getElementById('waList');
    document.addEventListener('click',function(e){ if(!f.contains(e.target)) l.classList.remove('show'); });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>
