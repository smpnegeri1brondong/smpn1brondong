<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Buku Tamu - SMPN 1 Brondong</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{font-family:Poppins,system-ui;box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a}
.input{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid #e2e8f0;background:#fff;font-size:14px}
.btn{padding:10px 18px;border-radius:999px;border:0;font-weight:600;font-size:13px;cursor:pointer}
.btn-blue{background:#0e4a8a;color:#fff}.btn-white{background:#fff;border:1px solid #e2e8f0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:10px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0}td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
</style></head><body>
<div id="loginScreen" style="min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0e4a8a,#1e40af)">
<div class="card" style="width:100%;max-width:380px"><h2>Admin Buku Tamu</h2><p style="font-size:12px;color:#64748b">SMPN 1 Brondong - Login</p>
<input id="passInput" class="input" type="password" placeholder="Password admin"><br><br>
<button class="btn btn-blue" style="width:100%" onclick="login()">Masuk</button><div id="loginError" style="font-size:12px;color:#dc2626;text-align:center;margin-top:8px"></div><div style="font-size:11px;color:#94a3b8;text-align:center;margin-top:8px">Default: admin123</div></div></div>
<div id="adminScreen" style="display:none">
<header style="position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e2e8f0"><div style="max-width:1200px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:10px"><b>SMPN 1 Brondong</b><span style="font-size:12px;color:#64748b">Admin - Firebase ✅</span></div><div style="display:flex;gap:8px"><a href="buku-tamu.html" class="btn btn-white" style="font-size:11px">Buka Buku Tamu</a><button class="btn btn-white" style="font-size:11px" onclick="logout()">Logout</button></div></div></header>
<div style="max-width:1200px;margin:0 auto;padding:20px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
<div class="card"><div style="font-size:11px;color:#64748b">Hari Ini</div><div id="statHariIni" style="font-size:24px;font-weight:800;color:#0e4a8a">0</div></div>
<div class="card"><div style="font-size:11px;color:#64748b">Total</div><div id="statTotal" style="font-size:24px;font-weight:800">0</div></div>
<div class="card"><div style="font-size:11px;color:#64748b">Instansi Unik</div><div id="statInstansi" style="font-size:24px;font-weight:800">0</div></div>
<div class="card"><div style="font-size:11px;color:#64748b">Firebase Status</div><div id="fbStatus" style="font-size:12px;font-weight:600;margin-top:6px;color:#16a34a">Terhubung</div></div>
</div>
<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px"><input id="searchInput" class="input" style="flex:1;min-width:200px" placeholder="Cari nama / instansi..." oninput="renderTamu()"><input id="filterTanggal" class="input" style="width:180px" type="date" onchange="renderTamu()"><button class="btn btn-white" onclick="clearFilter()">Clear</button><button class="btn btn-blue" onclick="exportCSV()">Export CSV</button><button class="btn btn-white" onclick="loadData()">Refresh</button></div>
<div style="display:grid;grid-template-columns:1fr 320px;gap:16px"><div class="card" style="overflow:auto"><table><thead><tr><th>Foto</th><th>Nama & Waktu</th><th>Instansi</th><th>Aksi</th></tr></thead><tbody id="tableBody"></tbody></table><div id="emptyState" style="display:none;padding:30px;text-align:center;color:#94a3b8;font-size:13px">Belum ada data</div></div><div class="card" style="position:sticky;top:80px"><div style="font-weight:700;font-size:14px;margin-bottom:10px">Preview Foto</div><div id="detailFotoWrap" style="display:none"><img id="detailFoto" style="width:100%;border-radius:12px;border:1px solid #e2e8f0;aspect-ratio:3/4;object-fit:cover"><div id="detailInfo" style="margin-top:10px;font-size:12px"></div><div style="display:flex;gap:8px;margin-top:12px"><a id="detailDownload" class="btn btn-white" style="flex:1;text-align:center;text-decoration:none;font-size:11px" download>Download</a><button class="btn" style="flex:1;background:#fee2e2;color:#dc2626;font-size:11px" onclick="hapusTamu()">Hapus</button></div></div><div id="detailEmpty" style="padding:20px;text-align:center;color:#94a3b8;font-size:12px">Klik foto tamu di tabel</div></div></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCBw7cC2wAxAMNfEJyPD-_62_qmlIw5ZyE",
  authDomain: "smpn1-brondong.firebaseapp.com",
  projectId: "smpn1-brondong",
  storageBucket: "smpn1-brondong.firebasestorage.app",
  messagingSenderId: "918473388225",
  appId: "1:918473388225:web:10074c05297aa3c9dce440",
  measurementId: "G-TNNR7EKEYH"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ADMIN_PASSWORD='admin123';
let allData=[]; let selectedIndex=null; let docIds=[];
function login(){ if(document.getElementById('passInput').value===ADMIN_PASSWORD){ localStorage.setItem('admin_login','1'); showAdmin(); } else { document.getElementById('loginError').textContent='Password salah!'; } }
window.login=login;
window.logout=()=>{ localStorage.removeItem('admin_login'); location.reload(); };
function showAdmin(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('adminScreen').style.display='block'; loadData(); }
if(localStorage.getItem('admin_login')==='1') showAdmin();
window.loadData=async()=>{
  const tbody=document.getElementById('tableBody'); tbody.innerHTML='<tr><td colspan=4 style="text-align:center;padding:20px">Loading dari Firebase...</td></tr>';
  try{
    const snap=await getDocs(collection(db,'buku_tamu'));
    allData=[]; docIds=[];
    snap.forEach(d=>{ allData.push(d.data()); docIds.push(d.id); });
    allData.sort((a,b)=>(b.createdLocal||'').localeCompare(a.createdLocal||''));
    document.getElementById('fbStatus').textContent='Terhubung ✅ '+allData.length+' data';
    renderTamu();
  }catch(e){
    document.getElementById('fbStatus').textContent='Error: '+e.message;
    tbody.innerHTML='<tr><td colspan=4 style="color:#dc2626;text-align:center;padding:20px">Gagal: '+e.message+'</td></tr>';
  }
};
window.renderTamu=()=>{
  const search=document.getElementById('searchInput').value.toLowerCase();
  const filterTgl=document.getElementById('filterTanggal').value;
  let filtered=allData.map((t,i)=>({...t,_idx:i})).filter(t=>{
    const matchSearch=!search || (t.nama+t.instansi+t.tujuan).toLowerCase().includes(search);
    const matchTgl=!filterTgl || t.tanggal===filterTgl;
    return matchSearch && matchTgl;
  });
  document.getElementById('statTotal').textContent=allData.length;
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('statHariIni').textContent=allData.filter(t=>t.tanggal===today).length;
  document.getElementById('statInstansi').textContent=new Set(allData.map(t=>t.instansi).filter(Boolean)).size;
  const tbody=document.getElementById('tableBody'); const empty=document.getElementById('emptyState');
  if(filtered.length===0){ tbody.innerHTML=''; empty.style.display='block'; return; } empty.style.display='none';
  tbody.innerHTML=filtered.map(t=>`<tr style="cursor:pointer" onclick="selectTamu(${t._idx})"><td><img src="${t.fotoURL||''}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;background:#f1f5f9"></td><td><b style="font-size:13px">${t.nama}</b><br><span style="font-size:11px;color:#64748b">${t.tanggal||''} ${t.jam||''}</span></td><td><div style="font-size:12px">${t.instansi||'-'}</div><div style="font-size:11px;color:#64748b">${t.tujuan||''}</div></td><td><button class="btn btn-white" style="font-size:10px;padding:6px 10px" onclick="event.stopPropagation(); selectTamu(${t._idx})">Lihat</button></td></tr>`).join('');
};
window.selectTamu=(idx)=>{
  selectedIndex=idx; const t=allData[idx];
  document.getElementById('detailFotoWrap').style.display='block'; document.getElementById('detailEmpty').style.display='none';
  document.getElementById('detailFoto').src=t.fotoURL||''; document.getElementById('detailDownload').href=t.fotoURL||'#';
  document.getElementById('detailInfo').innerHTML=`<b>${t.nama}</b><br>Instansi: ${t.instansi||'-'}<br>Tanggal: ${t.tanggal||''} ${t.jam||''}<br>Tujuan: ${t.tujuan||'-'}<br>Keperluan: ${t.keperluan||'-'}`;
};
window.hapusTamu=async()=>{
  if(selectedIndex===null) return; if(!confirm('Hapus '+allData[selectedIndex].nama+' ?')) return;
  try{ await deleteDoc(doc(db,'buku_tamu', docIds[selectedIndex])); alert('Terhapus'); loadData(); document.getElementById('detailFotoWrap').style.display='none'; document.getElementById('detailEmpty').style.display='block'; }catch(e){ alert('Error: '+e.message); }
};
window.clearFilter=()=>{ document.getElementById('searchInput').value=''; document.getElementById('filterTanggal').value=''; renderTamu(); };
window.exportCSV=()=>{
  if(allData.length===0){ alert('Tidak ada data'); return; }
  const header=['Waktu','Nama','Instansi','Tanggal','Jam','Tujuan','Keperluan','FotoURL'];
  const rows=allData.map(t=>[t.createdLocal||t.created?.seconds||'',t.nama,t.instansi,t.tanggal,t.jam,t.tujuan,t.keperluan,'foto di Firestore']);
  const csv=[header,...rows].map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`.replace(/\n/g,' ')).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='buku-tamu-smpn1-brondong.csv'; a.click();
};
document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
</script>
</body></html>
